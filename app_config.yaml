# app_config.yaml
# 应用配置

# 数据存储根目录（可写，支持绝对路径或相对路径）
# 绝对路径示例：C:\ProgramData\.MyWorkbench
# 相对路径示例：./data（相对于可执行文件所在目录）
data_dir: "."

# 子目录（相对于 data_dir）
uploads_dir: "data/uploads"
generate_dir: "data/generate"
logs_dir: "logs"
temp_dir: "temp"

# 配置文件（mcp_config.json）存放路径
# 支持绝对路径或相对于 data_dir
mcp_config_path: "mcp_config.json"

# 静态文件目录（只读，打包时位于 _MEIPASS 内）
# 此路径相对于项目根目录（开发时）或 _MEIPASS（打包后）
static_dir: "frontend/dist"

# 其他配置
max_upload_size_mb: 100

# 工具调用步数上限（单次对话中 LLM 最多进行多少轮工具调用）
# 复杂任务（如 PPT 生成、多步骤脚本执行）建议提高此值
max_tool_steps: 80

# 模型调用容错配置（可选）
retry:
  max_retries: 3      # API 调用失败最大重试次数
  base_delay: 1.0     # 重试基础间隔（秒），实际延迟 = base_delay * 2^attempt

# 可选：模型调用失败时的全局降级配置
fallback:
  enabled: false
  model_name: ""
  base_url: ""
  api_key: ""

# 语音服务配置（STT 语音转文字 + TTS 文字转语音）
# 注意：前端已使用浏览器原生 SpeechRecognition / speechSynthesis，无需后端 API。
# 以下配置为可选增强（例如需要更高精度的 whisper 或更自然的 TTS 音色时启用）。
# 如果留空，则自动复用聊天模型的 API Key 和 Base URL。
voice:
  enabled: true
  # STT（语音转文字）模型，如 whisper-1
  stt_model: "whisper-1"
  # TTS（文字转语音）模型，如 tts-1 或 tts-1-hd
  tts_model: "tts-1"
  # TTS 语音音色：alloy / echo / fable / onyx / nova / shimmer
  tts_voice: "nova"
  # 语音服务的 API 地址和 Key（留空则复用 LLM 配置）
  stt_base_url: ""
  stt_api_key: ""
  tts_base_url: ""
  tts_api_key: ""

# 语音助手配置（「小爱同学」式，P0 按键触发；P1 唤醒词；P2 定时/本地引擎）
voice_assistant:
  enabled: true        # 总开关
  # 唤醒方式：whisper = 本地 faster-whisper 转写匹配中文唤醒词（推荐，支持中文）；
  #           oww     = openWakeWord（仅英文内置/自训模型，中文走不通）
  wake_mode: "whisper"
  wake_word: "你好，海之芯"  # 唤醒词（whisper 模式直接匹配这段中文；oww 模式为英文/自训模型名）
  wake_threshold: 0.5  # oww 模式唤醒置信度阈值（whisper 模式忽略）
  # —— oww 模式专用 ——
  # 自定义唤醒词 ONNX 模型路径（留空则回退英文内置模型）
  wake_model_path: ""
  # oww 模型下载镜像前缀（留空直连 GitHub）。国内可设代理前缀，例如 https://ghproxy.com
  wake_model_mirror: ""
  # —— whisper 模式专用 ——
  # 本地模型大小：tiny 最快（约 75MB）/ base 较准 / small 更准（约 460MB）
  whisper_model: "tiny"
  # HuggingFace 镜像（留空用官方）。国内网络建议设 https://hf-mirror.com 加速模型下载
  # 注意：走镜像时必须禁用 xet（代码内已自动设置 HF_HUB_DISABLE_XET=1）
  whisper_mirror: "https://hf-mirror.com"
  # 静默判定：说完后静音多久（秒）自动结束收音（P1 VAD）
  silence_timeout: 1.2
  # 单句最长收音时长（秒）
  max_listen_seconds: 15
  # —— 本地引擎（P2）——
  # STT：local = faster-whisper 本地转写（免 key，可离线，速度看 whisper_model）；
  #       cloud = 复用 voice 节云端 STT（whisper-1 等，需 key）
  stt_engine: "local"
  # TTS：edge = edge-tts 合成 + pygame 后端本地播报（窗口最小化也能出声、可打断，需联网）；
  #       cloud = 前端 useTTS 播报（浏览器 speechSynthesis / LLM TTS）
  tts_engine: "edge"
  edge_voice: "zh-CN-XiaoxiaoNeural"  # edge-tts 音色（自然中文女声）
  edge_rate: "+0%"                    # 语速，如 +10% / -10%

# 定时提醒（P2）：应用内通知 + 本地语音播报。到点会弹 Windows Toast + 语音播报。
reminders:
  enabled: true         # 总开关
  file: ""              # 持久化文件路径（留空 → data_dir/reminders.json）
  check_interval: 2     # 调度器轮询间隔（秒）

# 邮件外发（P3）：system_send_email 工具使用的 SMTP 账户。
# smtp_pass 填「授权码」而非登录密码（QQ/163/Gmail 等均需在邮箱设置里开启 SMTP 并生成授权码）。
email:
  enabled: false        # 总开关
  smtp_host: ""         # SMTP 服务器，如 smtp.qq.com / smtp.163.com / smtp.gmail.com
  smtp_port: 465        # 465=SSL，587=STARTTLS
  smtp_user: ""         # 登录账号（通常等于发件邮箱）
  smtp_pass: ""         # SMTP 授权码
  from_addr: ""         # 发件人显示地址（留空用 smtp_user）
  use_ssl: true         # true=SSL(465)；false=STARTTLS(587)

# 微信外发（P3）：system_send_wechat 工具，把消息推送到「你自己的微信」。
# 二选一：PushPlus（https://www.pushplus.plus）或 Server酱（https://sct.ftqq.com）。
# 两者都是免费的自通知服务——只需扫码绑定自己的微信即可，无需对方授权。
wechat:
  enabled: false        # 总开关
  service: "pushplus"   # pushplus | serverchan
  pushplus_token: ""    # PushPlus 的 token（service=pushplus 时用）
  serverchan_sendkey: ""  # Server酱 的 SendKey（SCT 开头，service=serverchan 时用）

# 智能模型切换配置（可选，默认关闭，由前端 localStorage 控制）
auto_switch:
  enabled: false          # 默认关闭，用户可在设置中手动开启
  rules:                  # 角色 → 使用场景映射
    vision: "图片/多模态输入"
    audio: "语音输入/输出"
    reasoning: "深度推理/分析/代码审查"
    video: "视频理解/生成"
    default: "以上均不匹配时的默认模型"

# 工具审批配置（可选，默认启用）
tool_approval:
  enabled: false
  # 需要用户审批的敏感工具列表
  sensitive_tools:
    - system_write_file
    - system_patch_file
    - system_run_command
    - system_delegate_task
    - system_power_action      # 关机/重启/睡眠等
    - system_send_email        # 外发邮件
    - system_send_wechat       # 微信推送
  # 是否支持"此会话始终允许"（同类工具一次批准后不再询问）
  session_whitelist: true

# OCR 配置（可选，需手动安装 Tesseract OCR 系统包）
ocr:
  enabled: false
  engine: "tesseract"
  lang: "chi_sim+eng"

# Skill 智能选择配置
skill_selection:
  enabled: true
  top_k: 5
  min_similarity: 0.3

# Skill 优先模式配置
# 当技能与用户查询的语义相似度超过阈值时，系统提示词会注入优先指令，
# 引导 LLM 优先使用匹配的技能，技能无法满足时才回退到系统工具。
skill_first:
  enabled: true          # 是否启用技能优先模式
  threshold: 0.4         # 相似度阈值（0-1），超过此值触发"技能优先"指令

# 意图识别路由配置
# 方案 A（关键词规则）+ 方案 B（LLM 轻量分类器）混合
# 自动检测用户消息意图，调整 Agent 参数（步数上限/工具注入/提示词风格）
intent_router:
  enabled: true           # 是否启用意图路由
  llm_classify: true      # 是否启用 LLM 分类器（false 则仅关键词检测）
  llm_threshold: 0.7      # LLM 分类置信度阈值（低于此值降级为 standard）

# 知识库索引并发配置（串行改并发后可控）
# 云端 embedding（硅基流动等）受 RPM 限流，本地 Ollama 受 GPU 算力限制，
# 两者默认 8 较稳妥，可按机器/服务商情况调高。
kb_index:
  embedding_concurrency: 1   # embedding 请求并发数（云端 TPM 限流，调低避免 429）
  file_concurrency: 2        # 同时处理的文件数（配合 embedding 并发控制总吞吐）
  # 分块参数（修改后需重建索引生效）
  chunk_max_chars: 800       # 单块最大字符数
  chunk_overlap: 100         # 二次切分的重叠字符数
  chunk_min_chars: 30        # 过短块丢弃阈值（如孤立标题）